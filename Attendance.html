
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل التفقد اليومي</title>
<style>
:root{
  --navy:#0b1f3a;--navy2:#122c52;--gold:#c9a24b;--bg:#eef2f7;--card:#ffffff;
  --ink:#1e293b;--muted:#64748b;--line:#e2e8f0;
  --green:#16a34a;--green-bg:#dcfce7;--orange:#f59e0b;--orange-bg:#fef3c7;
  --red:#dc2626;--red-bg:#fee2e2;--gray:#6b7280;--gray-bg:#f3f4f6;--blue:#1d4ed8;--blue2:#2563eb;
  --radius:14px;--shadow:0 6px 18px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font-family:inherit}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.brand h1{font-size:20px;font-weight:800;line-height:1.2}
.brand .date{font-size:12px;color:#b9c7dd;margin-top:3px}
.badge-batt{background:rgba(201,162,75,.15);border:1px solid rgba(201,162,75,.5);color:var(--gold);font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;white-space:nowrap;flex-shrink:0}
main{max-width:960px;margin:0 auto;padding:0 10px 20px}
.counters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:18px 0 0}
.counter-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 8px;text-align:center;position:relative;overflow:hidden}
.counter-card::before{content:"";position:absolute;top:0;right:0;left:0;height:4px}
.counter-card.total::before{background:var(--navy)}
.counter-card.present::before{background:var(--green)}
.counter-card.excused::before{background:var(--orange)}
.counter-card.unexcused::before{background:var(--red)}
.counter-card.notchecked::before{background:var(--gray)}
.counter-card .num{font-size:32px;font-weight:800;line-height:1.1}
.counter-card.total .num{color:var(--navy)}
.counter-card.present .num{color:var(--green)}
.counter-card.excused .num{color:var(--orange)}
.counter-card.unexcused .num{color:var(--red)}
.counter-card.notchecked .num{color:var(--gray)}
.counter-card .label{font-size:12px;color:var(--muted);margin-top:3px;font-weight:700}
.tabs{display:flex;gap:8px;padding:16px 0 0}
.tab{flex:1;min-height:48px;padding:12px 8px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--muted);font-weight:800;font-size:15px;cursor:pointer;box-shadow:var(--shadow);transition:.2s;touch-action:manipulation}
.tab.active{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.tab:active{transform:scale(.97)}
.toolbar{display:flex;gap:10px;padding:16px 0 0;align-items:center;flex-wrap:wrap}
#search{flex:1;min-width:200px;min-height:48px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;outline:none;transition:.2s}
#search:focus{border-color:var(--blue)}
.loc-label{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
#locationFilter{min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;outline:none;transition:.2s;color:var(--ink);cursor:pointer;max-width:100%}
#locationFilter:focus{border-color:var(--blue)}
.legend{font-size:12px;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;padding:16px 0}
.soldier-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;transition:.15s;box-shadow:var(--shadow);touch-action:manipulation}
.soldier-chip .s-id{font-size:12px;font-weight:800;color:var(--blue)}
.soldier-chip .s-name{font-weight:800;font-size:14px;text-align:center;overflow-wrap:anywhere}
.soldier-chip .s-point{font-size:11px;color:var(--muted);text-align:center}
.soldier-chip .s-status{font-size:11px;font-weight:800;padding:4px 12px;border-radius:999px;color:var(--muted);background:#f1f5f9;white-space:nowrap}
.soldier-chip.notchecked{border-color:var(--line);background:var(--gray-bg)}
.soldier-chip.present{border-color:var(--green);background:var(--green-bg)}
.soldier-chip.present .s-status{background:var(--green);color:#fff}
.soldier-chip.excused{border-color:var(--orange);background:var(--orange-bg)}
.soldier-chip.excused .s-status{background:var(--orange);color:#fff}
.soldier-chip.unexcused{border-color:var(--red);background:var(--red-bg)}
.soldier-chip.unexcused .s-status{background:var(--red);color:#fff}
.soldier-chip:active{transform:scale(.95)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;background:var(--card);border-radius:var(--radius);border:2px dashed var(--line);font-weight:700}
.export-wrap{position:sticky;bottom:0;z-index:15;padding:12px 0 20px;display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(238,242,247,0),var(--bg) 45%)}
#newDayBtn{width:100%;max-width:480px;min-height:52px;padding:12px 14px;border:2px solid var(--blue2);border-radius:14px;background:#fff;color:var(--blue);font-size:15px;font-weight:800;cursor:pointer;transition:.2s;touch-action:manipulation}
#newDayBtn:hover{background:var(--blue);color:#fff}
#newDayBtn:active{transform:scale(.97)}
#exportBtn{width:100%;max-width:480px;min-height:56px;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(29,78,216,.35);transition:.2s;touch-action:manipulation}
#exportBtn:active{transform:scale(.97)}
footer{text-align:center;padding:6px 10px 20px;color:var(--muted);font-size:12px}
@media(max-width:600px){
  main{max-width:100%;margin:10px;padding:12px}
  header{padding:14px 12px}
  .brand h1{font-size:16px}
  .brand .date{font-size:11px}
  .badge-batt{font-size:10px;padding:5px 10px}
  .counters{grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 0 0}
  .counter-card .num{font-size:26px}
  .counter-card .label{font-size:11px}
  .tabs{padding:12px 0 0}
  .tab{font-size:14px;padding:10px 6px}
  .toolbar{padding:12px 0 0;flex-direction:column;align-items:stretch;gap:8px}
  #search{width:100%;min-width:0}
  .loc-label{white-space:normal}
  #locationFilter{width:100%}
  .legend{white-space:normal;text-align:center}
  .grid{grid-template-columns:1fr;gap:10px;padding:12px 0}
  .soldier-chip{min-height:56px;padding:14px}
  .soldier-chip .s-name{font-size:13px}
  .export-wrap{padding:10px 0 12px}
  #newDayBtn,#exportBtn{max-width:100%}
  footer{padding:6px 10px 16px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>سجل التفقد اليومي</h1>
    <div class="date" id="headerDate"></div>
  </div>
  <span class="badge-batt" id="battBadge">الكتيبة الأولى</span>
</header>
<main>
  <section class="counters">
    <div class="counter-card total"><div class="num" id="cntTotal">0</div><div class="label">مجموع القوة</div></div>
    <div class="counter-card notchecked"><div class="num" id="cntNotChecked">0</div><div class="label">غير محدد</div></div>
    <div class="counter-card present"><div class="num" id="cntPresent">0</div><div class="label">حضور</div></div>
    <div class="counter-card excused"><div class="num" id="cntExcused">0</div><div class="label">غياب مبرر</div></div>
    <div class="counter-card unexcused"><div class="num" id="cntUnexcused">0</div><div class="label">غياب غير مبرر</div></div>
  </section>
  <nav class="tabs">
    <button class="tab active" data-batt="1">الكتيبة الأولى</button>
    <button class="tab" data-batt="2">الكتيبة الثانية</button>
  </nav>
  <div class="toolbar">
    <input type="text" id="search" placeholder="بحث عن الرقم الذاتي أو الاسم الصريح أو النقطة...">
    <label class="loc-label" for="locationFilter">📍 تصفية حسب النقطة</label>
    <select id="locationFilter"></select>
    <span class="legend" id="legend">اضغط على البطاقة لتغيير الحالة</span>
  </div>
  <div class="grid" id="soldierGrid"></div>
  <div class="export-wrap">
    <button id="newDayBtn">🔄 بدء تفقد يوم جديد</button>
    <button id="exportBtn">استخراج تقرير التفقد النهائي (Excel)</button>
  </div>
</main>
<footer>نظام التفقد اليومي — ملف التفقد الرسمي</footer>

      if(st==='h')p++;else if(st==='e')e++;else if(st==='u')u++;
    });
    $id('cntTotal').textContent=list.length;
    $id('cntNotChecked').textContent=list.length-p-e-u;
    $id('cntPresent').textContent=p;
    $id('cntExcused').textContent=e;
    $id('cntUnexcused').textContent=u;
    $id('battBadge').textContent=battName(activeBatt);
  }
  function renderTabs(){
    var tabs=document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){
      var t=tabs[i];
      if(parseInt(t.getAttribute('data-batt'),10)===activeBatt)t.classList.add('active');
      else t.classList.remove('active');
    }
  }
  function renderGrid(){
    var grid=$id('soldierGrid');
    var q=String($id('search').value||'').trim();
    var loc=String($id('locationFilter').value||'').trim();
    var list=getFiltered();
    var today=todayKey();
    var att=db.attendance[today]||{};
    grid.innerHTML='';
    $id('legend').textContent=(q||loc)?('عرض '+list.length+' من '+getSoldiersByBatt(activeBatt).length+' عنصر'):'اضغط على البطاقة لتغيير الحالة';
    if(!list.length){
      var empty=document.createElement('div');
      empty.className='empty';
      empty.textContent='لا يوجد عناصر مطابقة';
      grid.appendChild(empty);
      return;
    }
    list.forEach(function(s){
      var st=att[s.id];
      var chip=document.createElement('button');
      chip.type='button';
      chip.className='soldier-chip'+(statusClass(st)?' '+statusClass(st):'');
      var idEl=document.createElement('span');idEl.className='s-id';idEl.textContent=s['الرقم الذاتي'];
      var nameEl=document.createElement('span');nameEl.className='s-name';nameEl.textContent=s['الاسم الصريح'];
      var pointEl=document.createElement('span');pointEl.className='s-point';pointEl.textContent='النقطة: '+s['النقطة'];
      var stEl=document.createElement('span');stEl.className='s-status';stEl.textContent=statusLabel(st);
      chip.appendChild(idEl);chip.appendChild(nameEl);chip.appendChild(pointEl);chip.appendChild(stEl);
      chip.addEventListener('click',function(){toggleStatus(s.id);});
      grid.appendChild(chip);
    });
  }
  function toggleStatus(id){
    var today=todayKey();
    if(!db.attendance[today])db.attendance[today]={};
    var att=db.attendance[today];
    att[id]=nextStatus(att[id]);
    save();updateCounters();renderGrid();
  }
  function startNewDay(){
    if(!confirm('هل أنت متأكد من تصفير تفقد اليوم الحالي وبدء يوم جديد؟'))return;
    if(!db.attendance) db.attendance={};
    var today=todayKey();
    var att={};
    db.soldiers.forEach(function(s){att[s.id]='';});
    db.attendance[today]=att;
    save();
    updateCounters();
    renderGrid();
  }
  function htmlEscape(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function compareSelfNum(a,b){
    var na=parseInt(a['الرقم الذاتي'],10),nb=parseInt(b['الرقم الذاتي'],10);
    if(!isNaN(na)&&!isNaN(nb))return na-nb;
    return String(a['الرقم الذاتي']).localeCompare(String(b['الرقم الذاتي']));
  }
  function exportCSV(){
    var today=todayKey();
    var time=nowTime();
    var headers=['الرقم الذاتي','الاسم الثلاثي','النقطة','الكتيبة','حالة التفقد الحالية','التاريخ','الوقت'];
    var all=db.soldiers.slice().sort(function(a,b){return (a['الكتيبة']-b['الكتيبة'])||compareSelfNum(a,b);});
    var att=db.attendance[today]||{};
    var body='';
    all.forEach(function(s){
      var st=statusLabel(att[s.id]);
      var cells=[s['الرقم الذاتي'],s['الاسم الصريح'],s['النقطة'],battName(s['الكتيبة']),st,today,time]
        .map(function(v){return '<td>'+htmlEscape(v)+'</td>';}).join('');
      body+='<tr>'+cells+'</tr>';
    });
    var widths=[16,45,24,20,24,14,10].map(function(w){return '<col style="width:'+w+'pt"/>';}).join('');
    var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">'
      +'<head><meta http-equiv="content-type" content="application/vnd.ms-excel; charset=utf-8"/>'
      +'<xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
      +'<x:Name>تقرير التفقد</x:Name>'
      +'<x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions>'
      +'</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml>'
      +'<style>th{font-weight:bold;color:#ffffff;background-color:#1F4E79;border:1pt solid #8fa8c8;white-space:nowrap;}'
      +'td{white-space:nowrap;border:1pt solid #d0d7e2;mso-number-format:"@";}</style>'
      +'</head><body>'
      +'<table dir="rtl" style="border-collapse:collapse">'
      +'<colgroup>'+widths+'</colgroup>'
      +'<tr>'+headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'
      +body
      +'</table></body></html>';
    var blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='تقرير_التفقد_النهائي_'+today+'.xls';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
  }
  function applySearch(){renderGrid();}
  function init(){
    db=load();
    activeBatt=(function(){try{var v=parseInt(localStorage.getItem(BATT_KEY),10);return (v===1||v===2)?v:1;}catch(e){return 1;}})();
    var d=new Date();
    $id('headerDate').textContent=new Intl.DateTimeFormat('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(d);
    var tabs=document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){
      tabs[i].addEventListener('click',function(){
        activeBatt=parseInt(this.getAttribute('data-batt'),10);
        try{localStorage.setItem(BATT_KEY,String(activeBatt));}catch(e){}
        populateLocations();
        renderTabs();updateCounters();renderGrid();
      });
    }
    $id('search').addEventListener('input',applySearch);
    $id('search').addEventListener('keyup',applySearch);
    $id('search').addEventListener('change',applySearch);
    $id('locationFilter').addEventListener('change',applySearch);
    $id('newDayBtn').addEventListener('click',startNewDay);
    $id('exportBtn').addEventListener('click',exportCSV);
    populateLocations();
    renderTabs();updateCounters();renderGrid();
  }
  init();
})();
</script>
</body>
</html>
